<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #222; }
    .axis-label { font-size: 13px; fill: #555; }
    .tick { font-size: 12px; fill: #444; }
    .legend { font-size: 13px; fill: #333; }
    .bar-docker { fill: #455a64; }
    .bar-kuadrat { fill: #26a69a; }
    .value { font-size: 11px; font-weight: 700; }
    .ratio { font-size: 10px; font-weight: 600; fill: #c62828; }
  </style>

  <!-- Chart area -->
  <rect x="80" y="30" width="510" height="280" fill="#fafafa" stroke="#e0e0e0" rx="4"/>

  <!-- Y axis labels + gridlines -->
  <line x1="80" y1="310" x2="590" y2="310" stroke="#888" stroke-width="1"/>
  <text x="72" y="314" text-anchor="end" class="tick">0</text>

  <line x1="80" y1="240" x2="590" y2="240" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="72" y="244" text-anchor="end" class="tick">100</text>

  <line x1="80" y1="170" x2="590" y2="170" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="72" y="174" text-anchor="end" class="tick">200</text>

  <line x1="80" y1="100" x2="590" y2="100" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="72" y="104" text-anchor="end" class="tick">300</text>

  <!-- Y axis title -->
  <text x="18" y="175" text-anchor="middle" class="axis-label" transform="rotate(-90, 18, 175)">RAM (MB)</text>

  <!-- Group 1: Fixed (0 containers) -->
  <g transform="translate(110, 0)">
    <!-- Docker: 140.3 MB → height = 140.3 * 0.7 = 98.21 → y = 310 - 98 = 212 -->
    <rect x="0" y="212" width="48" height="98" rx="3" class="bar-docker"/>
    <text x="24" y="207" text-anchor="middle" class="value" fill="#455a64">140.3</text>
    <!-- kuadrat: 0 → height 0 → invisible -->
    <rect x="56" y="310" width="48" height="0" rx="3" class="bar-kuadrat"/>
    <text x="80" y="307" text-anchor="middle" class="value" fill="#26a69a">0</text>
    <!-- ratio -->
    <text x="52" y="198" text-anchor="middle" class="ratio">∞</text>
    <!-- x label -->
    <text x="52" y="330" text-anchor="middle" class="tick">Fixed</text>
    <text x="52" y="344" text-anchor="middle" class="tick" font-size="10" fill="#888">0 containers</text>
  </g>

  <!-- Group 2: Marginal (per container) -->
  <g transform="translate(275, 0)">
    <!-- Docker: 19.3 MB → height = 13.5 → y = 310 - 13.5 = 296.5 -->
    <rect x="0" y="296" width="48" height="14" rx="3" class="bar-docker"/>
    <text x="24" y="293" text-anchor="middle" class="value" fill="#455a64">19.3</text>
    <!-- kuadrat: 2.5 MB → height = 1.75 → y = 308 -->
    <rect x="56" y="308" width="48" height="2" rx="3" class="bar-kuadrat"/>
    <text x="80" y="305" text-anchor="middle" class="value" fill="#26a69a">2.5</text>
    <!-- ratio -->
    <text x="52" y="287" text-anchor="middle" class="ratio">7.8×</text>
    <!-- x label -->
    <text x="52" y="330" text-anchor="middle" class="tick">Marginal</text>
    <text x="52" y="344" text-anchor="middle" class="tick" font-size="10" fill="#888">per container</text>
  </g>

  <!-- Group 3: 10 containers -->
  <g transform="translate(440, 0)">
    <!-- Docker: 334 MB → height = 233.8 → y = 310 - 233.8 = 76 -->
    <rect x="0" y="76" width="48" height="234" rx="3" class="bar-docker"/>
    <text x="24" y="71" text-anchor="middle" class="value" fill="#455a64">334</text>
    <!-- kuadrat: 25 MB → height = 17.5 → y = 310 - 17.5 = 292.5 -->
    <rect x="56" y="293" width="48" height="17" rx="3" class="bar-kuadrat"/>
    <text x="80" y="290" text-anchor="middle" class="value" fill="#26a69a">25</text>
    <!-- ratio -->
    <text x="52" y="62" text-anchor="middle" class="ratio">13.4×</text>
    <!-- x label -->
    <text x="52" y="330" text-anchor="middle" class="tick">10 containers</text>
    <text x="52" y="344" text-anchor="middle" class="tick" font-size="10" fill="#888">total supervisor</text>
  </g>

  <!-- Legend -->
  <rect x="160" y="370" width="14" height="14" rx="2" class="bar-docker"/>
  <text x="180" y="381" class="legend">Docker</text>
  <rect x="260" y="370" width="14" height="14" rx="2" class="bar-kuadrat"/>
  <text x="280" y="381" class="legend">kuadrat</text>

  <!-- Title -->
  <text x="320" y="22" text-anchor="middle" class="title">Supervisor RAM — Docker vs kuadrat</text>

  <!-- Caveat -->
  <text x="320" y="405" text-anchor="middle" font-size="10" fill="#999">RSS, not PSS — see benchmark method in repo. Ubuntu 24.04, Podman 4.9.3 vs Docker 29.1.3.</text>
</svg>
